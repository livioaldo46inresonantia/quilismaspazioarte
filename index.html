<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Periodo Padova 1975 - ANTONIO FORTUN | QuilismaSpazioArte</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Georgia', serif; 
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 80px;
            padding-bottom: 40px;
            border-bottom: 1px solid #333;
        }
        
        h1 { 
            font-size: 42px; 
            color: #f5f5f5; 
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .sottotitolo { 
            font-size: 16px; 
            color: #888; 
            font-style: italic;
            letter-spacing: 1px;
        }
        
        .galleria {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* SPOT GALLERIA */
        .opera {
            margin-bottom: 120px;
            position: relative;
            padding: 60px 40px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
        }
        
        /* Effetto luce spot dall'alto */
        .opera::before {
            content: '';
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(255,255,240,0.15) 0%, rgba(255,255,240,0.05) 40%, transparent 70%);
            pointer-events: none;
        }
        
        .opera img {
            width: 100%;
            max-width: 600px;
            display: block;
            margin: 0 auto 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 
                0 0 40px rgba(255,255,255,0.1),
                0 20px 60px rgba(0,0,0,0.8);
            border: 8px solid #1a1a1a;
        }
        
        .opera img:hover {
            transform: scale(1.02);
            box-shadow: 
                0 0 60px rgba(255,255,255,0.2),
                0 25px 80px rgba(0,0,0,0.9);
        }
        
        .info-quadro {
            text-align: center;
            margin-top: 20px;
        }
        
        .info-quadro p {
            margin: 8px 0;
        }
        
        .titolo-opera {
            font-size: 22px;
            color: #f5f5f5;
            font-style: italic;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        
        .tecnica {
            font-size: 15px;
            color: #999;
        }
        
        .anno-misure {
            font-size: 17px;
            color: #bbb;
        }
        
        .artista {
            font-size: 18px;
            color: #ccc;
            margin-top: 15px;
            cursor: pointer;
            transition: color 0.3s;
            display: inline-block;
            letter-spacing: 2px;
        }
        
        .artista:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        
        /* Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: #1a1a1a;
            margin: 5% auto;
            padding: 50px;
            width: 85%;
            max-width: 700px;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close {
            color: #666;
            float: right;
            font-size: 38px;
            font-weight: 300;
            cursor: pointer;
            line-height: 20px;
            transition: color 0.3s;
        }
        
        .close:hover {
            color: #fff;
        }
        
        .modal-content h2 {
            margin-top: 0;
            color: #f5f5f5;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        
        .modal-content p {
            line-height: 1.8;
            color: #ccc;
            font-size: 17px;
            margin-bottom: 20px;
        }
        
        .modal-content strong {
            color: #fff;
        }
        
        .nota {
            font-style: italic;
            color: #777;
            margin-top: 30px;
            font-size: 14px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
        }
    </style>
</head>
